name: 화면 점검(임시)
on:
  push:
    branches: ['claude/guest-tutorial-check']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/onboarding.test.ts
      - run: pnpm build
      - run: node scripts/gate-shots.tmp.mjs /tmp/out
      - if: always()
        run: |
          cd /tmp/out
          git init -q -b claude/guest-tutorial-result
          git config user.name "check-bot"; git config user.email "check-bot@users.noreply.github.com"
          git add -A && git commit -qm "result ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/guest-tutorial-result
